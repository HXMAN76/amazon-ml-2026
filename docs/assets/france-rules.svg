<rect x="40" y="477" width="54" height="24" rx="12" fill="#e3b341" opacity="0.18" stroke="#e3b341"/>
<text x="67" y="493.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="800" fill="#e3b341">ADD</text>
<text x="110" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Re-add invented names</text>
<text x="110" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">plain invented names between p 0.995 and 0.9999, where France shows no excess</text>
<text x="916" y="494" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#e3b341">no French excess</text>
<text x="28" y="544" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">Result: France F0.5 from about 0.963 to about 0.977; <tspan fill="#e3b341" font-weight="700">v8w_s29_FIN = 0.987745</tspan> on the leaderboard.</text>
<text x="28" y="566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Break-even from the leaderboard: a French drop helps when more than 26% of what it removes is wrong.</text>
</svg>
