<svg xmlns="http://www.w3.org/2000/svg" width="960" height="578" viewBox="0 0 960 578">
<rect width="960" height="578" rx="14" fill="#161b22"/>
<text x="28" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6edf3">France decoding: the rules of the submitted file</text>
<text x="28" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Applied in order to France's pairs only; each kept because France shows far more of that kind per 1,000 S1 than the US and India</text>
<rect x="28" y="90" width="904" height="54" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="40" y="105" width="54" height="24" rx="12" fill="#f47067" opacity="0.18" stroke="#f47067"/>
<text x="67" y="121.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="800" fill="#f47067">DROP</text>
<text x="110" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Type-word swaps</text>
<text x="110" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">the names differ by one business-type word from a learned list of 43 (nje ecole / nje centre)</text>
<text x="916" y="122" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f47067">86–90% decoys</text>
<rect x="28" y="152" width="904" height="54" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="40" y="167" width="54" height="24" rx="12" fill="#f47067" opacity="0.18" stroke="#f47067"/>
<text x="67" y="183.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="800" fill="#f47067">DROP</text>
<text x="110" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Below p 0.9999, unless a French copy</text>
<text x="110" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">kept: equal after spaced legal forms, initials, noise-word copies (fils, groupe), glued names</text>
<text x="916" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f47067">France p over-confident</text>
<rect x="28" y="214" width="904" height="54" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="40" y="229" width="54" height="24" rx="12" fill="#f47067" opacity="0.18" stroke="#f47067"/>
<text x="67" y="245.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="800" fill="#f47067">DROP</text>
<text x="110" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Legal-form conflicts</text>
<text x="110" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">both names carry legal forms that share none (SARL against SAS)</text>
<text x="916" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f47067">5–9% true, 4× US rate</text>
<rect x="28" y="276" width="904" height="54" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="40" y="291" width="54" height="24" rx="12" fill="#f47067" opacity="0.18" stroke="#f47067"/>
<text x="67" y="307.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="800" fill="#f47067">DROP</text>
<text x="110" y="299" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Namesakes on another street</text>
<text x="110" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">an exact name shared by 11+ French S1, at a different street</text>
<text x="916" y="308" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f47067">58 vs ≤ 5 per 1,000 S1</text>
<rect x="28" y="338" width="904" height="54" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="40" y="353" width="54" height="24" rx="12" fill="#56d4c4" opacity="0.18" stroke="#56d4c4"/>
<text x="67" y="369.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="800" fill="#56d4c4">KEEP</text>
<text x="110" y="361" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Protect</text>
<text x="110" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">an S1 the cuts would leave empty keeps its best pair (p ≥ 0.9): an empty list scores 0</text>
<text x="916" y="370" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#56d4c4">per-S1 metric</text>
<rect x="28" y="400" width="904" height="54" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="40" y="415" width="54" height="24" rx="12" fill="#e3b341" opacity="0.18" stroke="#e3b341"/>
<text x="67" y="431.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="800" fill="#e3b341">ADD</text>
<text x="110" y="423" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Restore</text>
<text x="110" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">unowned copies at the S1's own address (noise-word copy, initials, spelled legal form, glued)</text>
<text x="916" y="432" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#e3b341">within free slots</text>
