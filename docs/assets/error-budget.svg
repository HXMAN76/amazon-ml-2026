<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330">
<rect width="960" height="330" rx="14" fill="#161b22"/>
<text x="28" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6edf3">Where the remaining holdout errors are</text>
<text x="28" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Locked holdout of 150,000 training S1 (US and India), stack s28, day 3</text>
<rect x="28" y="86" width="290" height="84" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="46" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="800" fill="#56d4c4">0.9988</text>
<text x="46" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">precision of kept pairs</text>
<text x="46" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">505,396 kept, 603 wrong</text>
<rect x="333" y="86" width="290" height="84" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="351" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="800" fill="#6cb6ff">97.4%</text>
<text x="351" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">of true pairs found and kept</text>
<text x="351" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">13,400 of 518,193 missed</text>
<rect x="638" y="86" width="290" height="84" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="656" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="800" fill="#e3b341">14,003</text>
<text x="656" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">errors in total</text>
<text x="656" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">false matches plus misses</text>
<text x="28" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">THE 14,003 ERRORS</text>
<rect x="28.0" y="214" width="481.2" height="40" rx="6" fill="#6cb6ff" opacity="0.85"/>
<text x="40.0" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#0d1117">7,500  ·  54%</text>
<text x="28.0" y="276" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6edf3">never proposed by candidate generation</text>
<rect x="512.2" y="214" width="377.9" height="40" rx="6" fill="#56d4c4" opacity="0.85"/>
<text x="524.2" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#0d1117">5,900  ·  42%</text>
<text x="512.2" y="276" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6edf3">proposed but scored too low</text>
<rect x="893.1" y="214" width="35.9" height="40" rx="6" fill="#f47067" opacity="0.85"/>
<text x="929.0" y="276" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6edf3">false matches (603)</text>
<text x="28" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Most misses are records with no address whose name belongs to several businesses; the model's probabilities already match how often those are true.</text>
</svg>
